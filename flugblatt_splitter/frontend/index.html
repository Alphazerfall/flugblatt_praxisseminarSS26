<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Flugblatt Splitter</title>
<script>
  // applied synchronously, before CSS paints, so there's no flash of the
  // wrong theme while app.js (a deferred module script) is still loading
  (function () {
    var stored = localStorage.getItem("flugblatt-splitter-theme");
    var theme = stored || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    document.documentElement.dataset.theme = theme;
  })();
</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="field">
    <label for="pdf-select">PDF</label>
    <select id="pdf-select">
      <option value="">– auswählen –</option>
    </select>
  </div>
  <div class="mode-switch" role="group" aria-label="Modus">
    <button type="button" data-mode="split" title="Seiten durchgehen und Schnitte setzen">Schneiden</button>
    <button type="button" data-mode="review" title="Verdächtige Grenzen aus segmentgrenzen.tsv abarbeiten">Grenzen prüfen</button>
  </div>
  <button id="btn-save" type="button" disabled>JSON speichern</button>
  <button id="btn-load-json" type="button" disabled>JSON laden</button>
  <span id="doc-summary" class="chip"></span>
  <div class="field">
    <label><input type="checkbox" id="metadata-toggle"> Metadaten anzeigen</label>
  </div>
  <div class="field">
    <label><input type="checkbox" id="theme-toggle"> Heller Modus</label>
  </div>
  <div id="status" class="status"></div>
</header>

<!-- Prüfmodus für docs/korpus/segmentgrenzen.tsv (pipelines/01_pdf/check_boundaries.py) -->
<section id="review-bar" class="review-bar" hidden>
  <div class="review-nav">
    <button type="button" id="review-prev" title="Voriger Fall, auch ein schon entschiedener">◀</button>
    <span id="review-position" class="review-position"></span>
    <button type="button" id="review-next" title="Nächster offener Fall">▶</button>
  </div>
  <div id="review-case" class="review-case"></div>
  <div class="review-actions">
    <span id="review-decided" class="review-decided" hidden></span>
    <button type="button" id="review-apply" class="review-apply" title="Vorschlag übernehmen, speichern, weiter"></button>
    <button type="button" id="review-reject" title="Vorschlag ablehnen, weiter"></button>
    <button type="button" id="review-unclear" title="Richtlinienfrage, weiter"></button>
    <button type="button" id="review-undo" title="Entscheidung zu diesem Fall zurücknehmen">Zurücknehmen</button>
  </div>
  <div class="review-filter">
    <select id="review-filter" title="Welche Fälle">
      <option value="sicher,wahrscheinlich">sicher + wahrscheinlich</option>
      <option value="sicher,wahrscheinlich,prüfen">alle Stufen</option>
      <option value="sicher">nur sicher</option>
      <option value="prüfen">nur prüfen</option>
    </select>
    <label><input type="checkbox" id="review-open-only" checked> nur offene</label>
    <span id="review-remaining" class="review-remaining" hidden></span>
    <span class="review-keys">Schnitt links von Hand setzen erledigt den Fall auch</span>
  </div>
</section>

<main id="app">
  <section id="preview-panel" class="pane">
    <div id="preview-list"></div>
  </section>

  <div id="panel-resizer" title="Zum Anpassen ziehen"></div>

  <section id="pages-panel" class="pane">
    <div id="pages-list"></div>
  </section>
</main>

<template id="tpl-segment-box">
  <div class="segment-box">
    <div class="segment-box-header">
      <span class="segment-range"></span>
      <input type="text" class="segment-note-input" placeholder="Notiz, z. B. Seite fehlt, Trennseite, beschädigt, unleserlich">
      <label class="segment-no-content-toggle">
        <input type="checkbox" class="segment-no-content-checkbox">
        Kein Inhalt
      </label>
      <button type="button" class="segment-confirm-btn">Bestätigen</button>
    </div>
    <div class="segment-extracted-meta"></div>
    <div class="segment-box-grid"></div>
  </div>
</template>

<template id="tpl-preview-thumb">
  <div class="preview-thumb" data-page-number="">
    <div class="preview-thumb-img-wrap">
      <img loading="lazy" alt="">
      <button type="button" class="preview-thumb-cut" title="Schnitt nach dieser Seite hinzufügen/entfernen"></button>
    </div>
    <span class="preview-thumb-label"></span>
  </div>
</template>

<template id="tpl-page">
  <div class="page" data-page-number="">
    <div class="page-thumb-wrap">
      <img class="thumb" loading="lazy" alt="">
      <span class="page-number-badge"></span>
    </div>
  </div>
</template>

<script type="module" src="/app.js"></script>
</body>
</html>
