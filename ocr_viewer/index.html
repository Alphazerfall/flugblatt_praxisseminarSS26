<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OCR Model Comparison</title>
<script>
  // applied synchronously, before CSS paints, so there's no flash of the
  // wrong theme while app.js (a deferred module script) is still loading
  (function () {
    var stored = localStorage.getItem("ocr-compare-theme");
    var theme = stored || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    document.documentElement.dataset.theme = theme;
  })();
</script>
<link rel="stylesheet" href="/ocr_viewer/style.css" />
</head>
<body>
<header class="topbar">
  <div class="field">
    <label for="doc-select">Document</label>
    <select id="doc-select"></select>
  </div>
  <div class="field">
    <label for="model-select">Model A</label>
    <select id="model-select"></select>
  </div>
  <div class="field">
    <label for="compare-mode">Compare mode</label>
    <select id="compare-mode">
      <option value="single">Single</option>
      <option value="side">Side-by-side</option>
      <option value="diff">Word diff</option>
      <option value="diff-struct">Structured diff</option>
      <option value="correct">Correct (gold standard)</option>
    </select>
  </div>
  <div class="field" id="model-b-field" hidden>
    <label for="model-select-b">Model B</label>
    <select id="model-select-b"></select>
  </div>
  <div class="field" id="annotator-field" hidden>
    <label for="annotator-input">Annotator</label>
    <input id="annotator-input" type="text" placeholder="e.g. fw" size="8" />
    <span id="annotator-progress" class="annotator-progress"></span>
  </div>
  <div class="field page-nav">
    <label for="page-input">Page</label>
    <button id="prev-page" type="button">&larr;</button>
    <input id="page-input" type="number" min="1" value="1" />
    <span id="page-total">/ -</span>
    <button id="next-page" type="button">&rarr;</button>
  </div>
  <div class="field">
    <label><input type="checkbox" id="toggle-boxes" checked /> Show boxes</label>
  </div>
  <div class="field">
    <label><input type="checkbox" id="theme-toggle" /> Light mode</label>
  </div>
  <details class="legend-details" id="legend-details">
    <summary>Legend</summary>
    <div id="type-legend" class="legend"></div>
  </details>
  <div id="status" class="status"></div>
</header>

<main class="panes" id="main">
  <div class="compare-row" id="row-a">
    <span class="row-label" id="row-label-a"></span>
    <section class="pane pdf-pane">
      <div class="pdf-wrap">
        <canvas id="pdf-canvas-a"></canvas>
        <div id="overlay-a" class="overlay"></div>
      </div>
    </section>
    <div class="pane-resizer" title="Drag to resize"></div>
    <section class="pane content-pane" id="content-pane-a">
      <div id="content-list-a" class="content-list"></div>
    </section>
    <section class="pane diff-pane" id="diff-pane" hidden>
      <div id="diff-legend" class="diff-legend"></div>
      <div id="diff-content" class="diff-content"></div>
    </section>
    <section class="pane correct-sidebar" id="correct-sidebar" hidden>
      <div class="correct-section sidebar-box" id="page-options">
        <div class="correct-heading">Page</div>
        <div class="page-status-box">
          <div class="correct-progress" id="correct-progress">&ndash;</div>
          <div class="page-complete-status" id="page-complete-status"></div>
        </div>
        <button id="insert-all-ocr" type="button" title="Overwrites every block's text with its OCR text">Insert all OCR text</button>
        <label class="correct-check"><input type="checkbox" id="reading-order-correct" checked /> Reading order is correct</label>
        <label class="correct-check"><input type="checkbox" id="layout-has-errors" /> Layout has errors</label>
        <label for="layout-error-note">Describe layout errors</label>
        <textarea id="layout-error-note" rows="3" placeholder="missed/spurious regions, wrong classification, wrong reading order, etc."></textarea>
        <label class="correct-check" id="layout-reviewed-field">
          <input type="checkbox" id="layout-reviewed" /> I've checked the reading order and layout
        </label>
        <label for="page-note">Page note</label>
        <textarea id="page-note" rows="4" placeholder="stamps, marginalia, struck-through text, decisions to record for the limitations write-up&hellip;"></textarea>
      </div>
      <div class="correct-section">
        <label class="correct-check"><input type="checkbox" id="show-gold-diff" /> Show diff vs raw OCR</label>
        <label class="correct-check"><input type="checkbox" id="show-all-boxes" /> Show all boxes</label>
      </div>
      <div class="correct-section correct-shortcuts">
        <div class="correct-heading">Shortcuts</div>
        <ul>
          <li><kbd>Tab</kbd> / <kbd>Shift</kbd>+<kbd>Tab</kbd> &mdash; next / prev block</li>
          <li><kbd>Ctrl</kbd>+<kbd>Enter</kbd> &mdash; commit &amp; next</li>
          <li><kbd>Alt</kbd>+<kbd>D</kbd> &mdash; toggle diff vs raw</li>
        </ul>
      </div>
      <div class="correct-save" id="correct-save"></div>
    </section>
  </div>
  <div class="row-resizer" id="row-resizer" title="Drag to resize" hidden></div>
  <div class="compare-row" id="row-b" hidden>
    <span class="row-label" id="row-label-b"></span>
    <section class="pane pdf-pane">
      <div class="pdf-wrap">
        <canvas id="pdf-canvas-b"></canvas>
        <div id="overlay-b" class="overlay"></div>
      </div>
    </section>
    <div class="pane-resizer" title="Drag to resize"></div>
    <section class="pane content-pane" id="content-pane-b">
      <div id="content-list-b" class="content-list"></div>
    </section>
  </div>
</main>

<script type="module" src="/ocr_viewer/app.js"></script>
</body>
</html>
