[project]
name = "flugblatt-praxisseminar"
version = "0.1.0"
description = ""
requires-python = ">=3.10"
dependencies = [
    "img2pdf",
    "pikepdf",
    "pillow",
    "pypdf",
    "python-dotenv",
    "requests",
    "datalab-python-sdk",
    "mistralai",
    "google-genai>=2.0.0",
    "openai",
    "pymupdf",
]

[project.optional-dependencies]
# CER/WER scoring of the gold standard produced by the OCR-viewer's Correct
# mode. Kept optional (pulls lxml/rapidfuzz/uniseg) — install with
#   pip install -e ".[eval]"
eval = [
    "dinglehopper",
]

# Structured (layout-blocks + bboxes) output from a self-hosted GLM-OCR
# server, via glm_convert.py. Pulls in torch/transformers to run
# PP-DocLayout-V3 locally - kept optional since it's a much heavier install
# than the other engines' plain API clients. Install with
#   pip install -e ".[glmocr]"
glmocr = [
    "glmocr[selfhosted]",
]

[tool.setuptools]
packages = []
