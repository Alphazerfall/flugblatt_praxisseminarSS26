[project]
name = "flugblatt-praxisseminar"
version = "0.1.0"
description = ""
requires-python = ">=3.10"
dependencies = [
    "img2pdf",
    "pikepdf",
    "pillow",
    "pypdf",
    "python-dotenv",
    "requests",
    "datalab-python-sdk",
    "mistralai",
    "google-genai>=2.0.0",
    "openai",
    "pymupdf",
]

[project.optional-dependencies]
# CER/WER scoring of the gold standard produced by the OCR-viewer's Correct
# mode. Kept optional (pulls lxml/rapidfuzz/uniseg) — install with
#   pip install -e ".[eval]"
eval = [
    "dinglehopper",
]
# NER pipeline (pipelines/03_ner/ner.py). Also requires the German large spaCy model:
#   python -m spacy download de_core_news_lg
ner = [
    "spacy>=3.7",
]
# Topic modelling pipeline (pipelines/04_topic/topic_modelling.py), BERTopic-
# based. Also benefits from the German large spaCy model (optional, only
# used to lemmatize topic-representation words):
#   python -m spacy download de_core_news_lg
topics = [
    "bertopic>=0.16",
    "sentence-transformers>=2.2",
    "stop-words",
    "spacy>=3.7",
]

[tool.setuptools]
packages = []
